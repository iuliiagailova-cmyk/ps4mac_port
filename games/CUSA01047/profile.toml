# Ratchet & Clank (2016, PS4) — game profile for ps4mac_port.
# Data only: the core reads it by the Title ID in sce_sys/param.sfo. Environment variables (and
# spartanport.ini, for the options it holds) win over the defaults below.

title = "Ratchet & Clank"
title_ids = ["CUSA01047"]          # EU; CUSA01073 and CUSA01928 not tested yet
match_title = "Ratchet"
app_name = "RnCPort"               # window title, in-game menu, data folder (~/Library/Application Support/RnCPort)

[patches]
file = "patches.xml"               # "Bug Fix - Address Space Base": required on macOS
app_ver = "01.00"

[env]
# The speed settings that were found here (readbacks, submissions every 30 draws, buffers in place,
# guest sync barriers, no driver bounds checks, the 3.5 GB texture budget on 8 GB Macs) are core
# defaults since 24.11.2026 (run.py, docs/architecture.md). What stays is R&C's own:
# 0x8900000000 (180 MiB, the game rewrites it every frame, ~143 MB/s) stays copied: in place, the
# GPU read data the game had already overwritten (fences are written when work is recorded):
# overexposed frames with orange halos.
SPARTAN_HOST_BUFFERS_SKIP = "0x8900000000"

[known_issues]
fire_green_bars = "Rare green vertical bars over fire for half a second (seen once with stale readbacks)"
start_black_screen = "Occasional black screen at start (a race, not found yet)"
buffer_bounds = "Buffer reads past a buffer's range are not checked (SPARTAN_NO_ROBUSTNESS=buffer with SPARTAN_SHADER_BOUNDS=writes): they return nearby data instead of 0 (writes are checked). None seen in the first level and fight; set SPARTAN_SHADER_BOUNDS to 1 (all accesses checked, ~13% slower) if a scene shows garbage"

[test]
# Autotest (autotest/drive.py): title screen -> Continue, seconds after launch.
menu = ["42 hold cross", "42.3 release", "48 hold cross", "48.3 release"]
