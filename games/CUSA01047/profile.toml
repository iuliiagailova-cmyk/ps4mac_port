# Ratchet & Clank (2016, PS4) — game profile for ps4mac_port.
# Data only: the core reads it by the Title ID in sce_sys/param.sfo. Environment variables (and
# spartanport.ini, for the options it holds) win over the defaults below.

title = "Ratchet & Clank"
title_ids = ["CUSA01047"]          # EU; CUSA01073 and CUSA01928 not tested yet
match_title = "Ratchet"
app_name = "RnCPort"               # window title, in-game menu, data folder (~/Library/Application Support/RnCPort)
icon = "branding/rncport-icon.png"

[patches]
file = "patches.xml"               # "Bug Fix - Address Space Base": required on macOS
app_ver = "01.00"

[env]
# The game reads GPU results every frame; stale readbacks keep CPU and GPU from waiting for each
# other (readbacks are published as soon as the GPU completes them).
SPARTAN_DEFERRED_READBACK = "1"
SPARTAN_STALE_READBACK = "1"
# Submit every 30 draws/dispatches: the GPU starts while the frame is still recorded, and the
# game, which waits every frame for its own GPU work (faults on GPU-written pages), waits less.
# 22.11.2026, 720p service mode: level 25.5 -> 29.7 FPS, fight start 41 -> 36.6 ms a frame
# (50: 37.9 ms; a submission per guest submit: 46-53 ms). At 8 FPS (20.11) 100 was best.
SPARTAN_FLUSH_DRAWS = "30"
# GPU buffers over guest memory in place, no copies (graphics service, arm64): Novalis service
# memory ~1.6 -> ~0.7 GB, walk 22.7 / 20.9 -> 23.6 / 23.4 FPS, fight unchanged (22.11.2026).
# 0x8100000000 (180 MiB, the game rewrites it every frame, ~143 MB/s) stays copied: in place,
# the GPU read data the game had already overwritten (fences are written when work is recorded):
# overexposed frames with orange halos.
SPARTAN_HOST_BUFFERS = "1"
SPARTAN_HOST_BUFFERS_SKIP = "0x8100000000"
# Buffer hazards between draws inside a render pass follow the game's own sync (cache flush events,
# AcquireMem) instead of breaking the pass: ~25 fewer render passes a frame on the tiled M1 GPU
# (level 10.7 -> 13.7 FPS, fight 9.4 -> 11.6; service mode 10.8 -> 13.4, 10.3 -> 12.7).
SPARTAN_GUEST_SYNC_BARRIERS = "1"
# No driver bounds checks on buffer accesses (robustBufferAccess/2 off): checking every access costs
# ~15% of the frame. The recompiled shaders check their own stores and atomics instead (GCN drops
# them past the end): level 13.8 -> 15.8 FPS, fight 12.7 -> 14.7 (service mode, frames checked).
# Image checks stay.
SPARTAN_NO_ROBUSTNESS = "buffer"
SPARTAN_SHADER_BOUNDS = "writes"

[known_issues]
fire_green_bars = "Rare green vertical bars over fire for half a second (seen once with stale readbacks)"
start_black_screen = "Occasional black screen at start (a race, not found yet)"
buffer_bounds = "Buffer reads past a buffer's range are not checked (SPARTAN_NO_ROBUSTNESS=buffer with SPARTAN_SHADER_BOUNDS=writes): they return nearby data instead of 0 (writes are checked). None seen in the first level and fight; set SPARTAN_SHADER_BOUNDS to 1 (all accesses checked, ~13% slower) if a scene shows garbage"

[test]
# Autotest (autotest/drive.py): title screen -> Continue, seconds after launch.
menu = ["42 hold cross", "42.3 release", "48 hold cross", "48.3 release"]
