# God of War III Remastered (PS4) — game profile for ps4mac_port.
# Data only: the core reads it by the Title ID in sce_sys/param.sfo. Environment variables (and
# spartanport.ini, for the options it holds) win over the defaults below.

title = "God of War III Remastered"
title_ids = ["CUSA01623", "CUSA01715", "CUSA01720"]  # tested: CUSA01623 v01.00 (US)
match_title = "God of War"
# God of War III's module in the core: cheats, orb multipliers, live engine frame rate, enemy health
# bar, QTE answers and the pause menu's Exit to Desktop (SpartanPort's features).
modules = ["god_of_war"]

[patches]
# SpartanPort's patch file (Texture Corruption Fix, resolution patches, ...). Its entries are tagged
# 01.02 but find their sites by signature, so they apply to v01.00 as well.
file = "patches.xml"
app_ver = "01.02"

[env]
# Lightning used to turn the screen white (the GPU read two chunks the game rewrites every frame);
# since 25.11.2026 the core finds such chunks itself (BufferCache::SampleHostChunks: 0xec04400000
# and 0xec41000000 here) and copies them: 0 of 89 and 0 of 95 frames white, 24.1 / 24.2 FPS.
